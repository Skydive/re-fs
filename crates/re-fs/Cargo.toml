[package]
name = "re-fs"
description = "FUSE view of a reMarkable tablet's documents"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
re-proto = { workspace = true, features = ["json"] }
re-render.workspace = true
# .rmdoc archives (stored, no compression needed: PDFs and strokes barely shrink).
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow.workspace = true
uuid = { workspace = true, features = ["v4"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "process", "sync", "time", "macros", "signal"] }
thiserror.workspace = true
arc-swap = "1"
postcard.workspace = true
# The saved index on disk (the wire uses lz4, which suits the tablet better).
zstd = "0.13"
rustls.workspace = true
rcgen.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# Reading the OpenSSH private key used to log in over Wi-Fi.
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519"] }

[target.'cfg(unix)'.dependencies]
# Pure-Rust mounting through fusermount3: no libfuse needed at build or run time.
fuser = { version = "0.15", default-features = false, features = ["abi-7-31"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
if-addrs = "0.13"
# WinFsp is loaded at run time (mount/winfsp/ffi.rs); these are the Win32 calls around it.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
] }

[features]
# re-fsw.exe, the windowless launcher `re-fs autostart` uses (built for Windows only).
windows-launcher = []

[[bin]]
name = "re-fsw"
path = "src/bin/re-fsw.rs"
required-features = ["windows-launcher"]
