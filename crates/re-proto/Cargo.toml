[package]
name = "re-proto"
description = "reMarkable format, tree and wire protocol shared by re-fs and re-fsd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Link the system libzstd (the tablet's /usr/lib/libzstd.so.1) instead of building it in.
zstd-system = ["zstd/pkg-config"]
# Parsing the tablet's JSON and building the tree. The client enables it; the agent doesn't.
json = ["dep:serde_json"]

[dependencies]
serde.workspace = true
serde_json = { workspace = true, optional = true }
uuid.workspace = true
thiserror.workspace = true
postcard.workspace = true
lz4_flex.workspace = true
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
uuid.workspace = true
