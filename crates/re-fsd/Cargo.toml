[package]
name = "re-fsd"
description = "reMarkable tablet agent for re-fs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
re-proto.workspace = true
uuid.workspace = true
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }
inotify = { version = "0.11", default-features = false }
rustix = { version = "1", features = ["fs"] }
lexopt = "0.3"
base64 = "0.22"
rustls = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
openssl = { version = "0.10", optional = true }

[features]
default = ["openssl"]
# TLS backend for Wi-Fi clients (pick one): the system OpenSSL 3 (the tablet's
# /usr/lib/libssl.so.3), for a small agent…
openssl = ["dep:openssl"]
# …or rustls + ring, statically linked (no system libraries needed).
rustls = ["dep:rustls", "dep:rcgen"]

[dev-dependencies]
# The tests' TLS client is always rustls (it's what re-fs uses), so they also
# check interoperability with the openssl backend.
rustls = { workspace = true }
rcgen = { workspace = true }
base64 = "0.22"
